<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STLFLIX · Engajamento Mensal</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0E1113;
    --panel: #161A1D;
    --panel-border: #262B2F;
    --text: #EDEFF1;
    --text-dim: #9AA3AA;
    --accent: #3B6BFF;
    --accent-2: #8FD14F;
    --danger: #FF6B5E;
    --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); padding:32px 24px 64px;
  }
  .wrap{max-width:1080px;margin:0 auto;}
  header{margin-bottom:32px;}
  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent-2); margin-bottom:8px;
  }
  h1{font-size:28px; margin:0 0 6px; font-weight:650; letter-spacing:-0.01em;}
  .sub{color:var(--text-dim); font-size:14px; max-width:560px; line-height:1.5;}

  .grid{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:16px;}
  @media(max-width:760px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--panel); border:1px solid var(--panel-border);
    border-radius:12px; padding:20px 22px;
  }
  .panel h2{font-size:13px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--text-dim); margin:0 0 16px; font-weight:600;}

  .kpi-row{display:flex; gap:24px; flex-wrap:wrap; margin-bottom:4px;}
  .kpi .val{font-family:var(--mono); font-size:32px; font-weight:600; line-height:1;}
  .kpi .label{font-size:12px; color:var(--text-dim); margin-top:6px;}
  .kpi .delta{font-family:var(--mono); font-size:13px; margin-top:4px;}
  .delta.up{color:var(--accent-2);}
  .delta.down{color:var(--danger);}
  .delta.flat{color:var(--text-dim);}

  canvas{max-height:280px;}

  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{text-align:left; padding:10px 8px; border-bottom:1px solid var(--panel-border);}
  th{color:var(--text-dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.05em;}
  td.num, th.num{text-align:right; font-family:var(--mono);}
  tr:last-child td{border-bottom:none;}

  .insight{
    display:flex; gap:10px; padding:12px 0; border-bottom:1px solid var(--panel-border);
    font-size:13.5px; line-height:1.5;
  }
  .insight:last-child{border-bottom:none;}
  .insight .dot{width:6px;height:6px;border-radius:50%;margin-top:7px;flex-shrink:0;}
  .dot.down{background:var(--danger);}
  .dot.up{background:var(--accent-2);}
  .dot.flat{background:var(--text-dim);}
  .insight b{font-weight:600;}

  .empty{
    color:var(--text-dim); font-size:14px; text-align:center; padding:48px 20px;
    border:1px dashed var(--panel-border); border-radius:12px; line-height:1.6;
  }
  .empty code{
    background:var(--panel); padding:2px 6px; border-radius:4px; font-family:var(--mono);
    font-size:12.5px;
  }
  footer{margin-top:32px; color:var(--text-dim); font-size:12px; text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">STLFLIX · Analytics</div>
    <h1>Engajamento mensal</h1>
    <div class="sub">Usuários logados que dispararam 2 ou mais ações de engajamento no mês fechado. Cada snapshot é fixo — não recalcula com o tempo.</div>
  </header>

  <div id="content"></div>

  <footer>Atualizado automaticamente todo início de mês via Amplitude · dados fechados, sem janela rolante</footer>
</div>

<script>
async function loadHistory(){
  try{
    const res = await fetch('./data/history.json', {cache:'no-store'});
    if(!res.ok) throw new Error('not found');
    return await res.json();
  }catch(e){
    return [];
  }
}

function fmtMonth(monthStr){
  const [y,m] = monthStr.split('-');
  const names = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${names[parseInt(m,10)-1]}/${y.slice(2)}`;
}

function fmtPct(n){ return (n*100).toFixed(1) + '%'; }
function fmtInt(n){ return n.toLocaleString('pt-BR'); }

function deltaClass(d){ if(Math.abs(d) < 0.001) return 'flat'; return d > 0 ? 'up' : 'down'; }
function deltaArrow(d){ if(Math.abs(d) < 0.001) return '→'; return d > 0 ? '↑' : '↓'; }

function buildInsights(history){
  const insights = [];
  if(history.length < 2) return insights;

  const last = history[history.length - 1];
  const prev = history[history.length - 2];
  const rateDelta = last.engagement_rate - prev.engagement_rate;
  const ratePct = prev.engagement_rate ? (rateDelta / prev.engagement_rate) * 100 : 0;

  insights.push({
    type: deltaClass(rateDelta),
    text: `Taxa de engajamento em <b>${fmtMonth(last.month)}</b>: <b>${fmtPct(last.engagement_rate)}</b>, ${rateDelta >= 0 ? 'alta' : 'queda'} de <b>${Math.abs(ratePct).toFixed(1)} p.p. relativos</b> vs ${fmtMonth(prev.month)}.`
  });

  const userDelta = last.logged_in_users - prev.logged_in_users;
  const userPct = prev.logged_in_users ? (userDelta / prev.logged_in_users) * 100 : 0;
  if(Math.abs(userPct) > 3){
    insights.push({
      type: deltaClass(userDelta),
      text: `Base de usuários logados ${userDelta >= 0 ? 'cresceu' : 'caiu'} <b>${Math.abs(userPct).toFixed(1)}%</b> (${fmtInt(prev.logged_in_users)} → ${fmtInt(last.logged_in_users)}), o que ${userDelta >= 0 ? 'pode diluir' : 'pode inflar'} a taxa de engajamento mesmo sem mudança real de comportamento.`
    });
  }

  if(history.length >= 3){
    const trend = history.slice(-3).map(r => r.engagement_rate);
    if(trend[0] > trend[1] && trend[1] > trend[2]){
      insights.push({type:'down', text:`Queda de engajamento é consecutiva há <b>3 meses</b> — vale investigar causa raiz, não só o mês mais recente.`});
    }
  }

  const rates = history.map(r => r.engagement_rate);
  const maxRate = Math.max(...rates);
  const maxMonth = history.find(r => r.engagement_rate === maxRate).month;
  if(last.month !== maxMonth){
    insights.push({type:'flat', text:`Melhor mês do período: <b>${fmtMonth(maxMonth)}</b> com ${fmtPct(maxRate)}.`});
  }

  return insights;
}

function render(history){
  const el = document.getElementById('content');

  if(history.length === 0){
    el.innerHTML = `
      <div class="empty">
        Nenhum snapshot salvo ainda.<br><br>
        O primeiro vai aparecer automaticamente após o robô rodar no início do próximo mês —
        ou rode manualmente agora pela aba <code>Actions</code> do repositório.
      </div>`;
    return;
  }

  const last = history[history.length - 1];
  const prev = history.length > 1 ? history[history.length - 2] : null;
  const rateDelta = prev ? last.engagement_rate - prev.engagement_rate : 0;
  const userDelta = prev ? last.logged_in_users - prev.logged_in_users : 0;

  const insights = buildInsights(history);

  el.innerHTML = `
    <div class="grid">
      <div class="panel">
        <h2>Comparativo mensal</h2>
        <canvas id="chart"></canvas>
      </div>
      <div class="panel">
        <h2>Mês mais recente · ${fmtMonth(last.month)}</h2>
        <div class="kpi-row">
          <div class="kpi">
            <div class="val">${fmtPct(last.engagement_rate)}</div>
            <div class="label">Taxa de engajamento</div>
            ${prev ? `<div class="delta ${deltaClass(rateDelta)}">${deltaArrow(rateDelta)} ${Math.abs(rateDelta*100).toFixed(1)} p.p. vs mês anterior</div>` : ''}
          </div>
        </div>
        <div class="kpi-row" style="margin-top:18px;">
          <div class="kpi">
            <div class="val" style="font-size:20px;">${fmtInt(last.engaged_users)}</div>
            <div class="label">Engajados (2+ ações)</div>
          </div>
          <div class="kpi">
            <div class="val" style="font-size:20px;">${fmtInt(last.logged_in_users)}</div>
            <div class="label">Usuários logados</div>
            ${prev ? `<div class="delta ${deltaClass(userDelta)}">${deltaArrow(userDelta)} ${fmtInt(Math.abs(userDelta))}</div>` : ''}
          </div>
        </div>
      </div>
    </div>

    ${insights.length ? `
    <div class="panel" style="margin-bottom:16px;">
      <h2>Insights automáticos</h2>
      ${insights.map(i => `<div class="insight"><div class="dot ${i.type}"></div><div>${i.text}</div></div>`).join('')}
    </div>` : ''}

    <div class="panel">
      <h2>Histórico completo</h2>
      <table>
        <thead>
          <tr>
            <th>Mês</th>
            <th class="num">Logados</th>
            <th class="num">Engajados</th>
            <th class="num">Taxa</th>
            <th class="num">Δ vs mês anterior</th>
          </tr>
        </thead>
        <tbody>
          ${history.slice().reverse().map((row, idx, arr) => {
            const next = arr[idx+1];
            const d = next ? row.engagement_rate - next.engagement_rate : null;
            return `<tr>
              <td>${fmtMonth(row.month)}</td>
              <td class="num">${fmtInt(row.logged_in_users)}</td>
              <td class="num">${fmtInt(row.engaged_users)}</td>
              <td class="num">${fmtPct(row.engagement_rate)}</td>
              <td class="num ${d !== null ? deltaClass(d) : ''}">${d !== null ? deltaArrow(d) + ' ' + Math.abs(d*100).toFixed(1) + ' p.p.' : '—'}</td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  `;

  const ctx = document.getElementById('chart');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: history.map(r => fmtMonth(r.month)),
      datasets: [{
        label: 'Taxa de engajamento',
        data: history.map(r => +(r.engagement_rate*100).toFixed(1)),
        backgroundColor: '#3B6BFF',
        borderRadius: 4,
        maxBarThickness: 40
      }]
    },
    options: {
      responsive: true,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: { label: (c) => `${c.formattedValue}%` }
        }
      },
      scales: {
        y: {
          beginAtZero: true,
          ticks: { color: '#9AA3AA', callback: (v) => v + '%' },
          grid: { color: '#262B2F' }
        },
        x: {
          ticks: { color: '#9AA3AA' },
          grid: { display: false }
        }
      }
    }
  });
}

loadHistory().then(render);
</script>
</body>
</html>
