name: Snapshot mensal de engajamento STLFLIX

# Roda automaticamente no dia 2 de cada mês, às 09:00 (horário de Brasília)
# Também pode ser rodado manualmente a qualquer momento pela aba "Actions" do GitHub
on:
  schedule:
    - cron: "0 12 2 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Buscar snapshot do mês fechado
        env:
          AMPLITUDE_API_KEY: ${{ secrets.AMPLITUDE_API_KEY }}
          AMPLITUDE_SECRET_KEY: ${{ secrets.AMPLITUDE_SECRET_KEY }}
          AMPLITUDE_CHART_ID: ${{ secrets.AMPLITUDE_CHART_ID }}
        run: python scripts/fetch_snapshot.py

      - name: Salvar novo dado no repositório
        run: |
          git config user.name "stlflix-bot"
          git config user.email "bot@stlflix.local"
          git add data/history.json
          git diff --staged --quiet && echo "Nada novo para salvar." || (git commit -m "Snapshot automático de engajamento" && git push)
